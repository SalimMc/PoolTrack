name: CI

# Adapted from the SwEnt bootcamp's CI: the same checks, without the
# bootcamp-specific parts (milestone filters, staff tests, time tracking, MCQ).

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# The jobs only read the repository, so the workflow token gets no write access.
permissions:
  contents: read

jobs:
  always-on:
    name: Always-on checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A tag can be moved to different code; a commit SHA cannot. The release job holds the signing
      # key, so every action in every workflow must stay pinned.
      - name: Check actions are pinned to commit SHAs
        run: |
          if grep -rnE '^\s*(-\s*)?uses:' .github/workflows | grep -vE '@[0-9a-f]{40}( |$)'; then
            echo "::error::Pin the actions above to a full commit SHA, with the tag as a comment."
            exit 1
          fi

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          # The last version listed becomes JAVA_HOME. Robolectric needs 21 for SDK 36.
          java-version: |
            17
            21

      - name: Retrieve gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Decode secrets
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          # The google-services plugin needs this file to build, and it is kept out of the repo.
          if [ -z "$GOOGLE_SERVICES" ]; then
            echo "::error::GOOGLE_SERVICES secret is not set. Add app/google-services.json, base64-encoded, as a repository secret."
            exit 1
          fi
          echo "$GOOGLE_SERVICES" | base64 --decode > ./app/google-services.json

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      - name: KTFmt Check
        run: |
          ./gradlew ktfmtCheck

      - name: Assemble
        run: |
          ./gradlew assembleDebug lint --parallel --build-cache

  firestore-rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: firebase/firestore/test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Firestore emulator is a Java program; firebase-tools 15 needs JDK 21.
      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firebase/firestore/test/package-lock.json

      - name: Retrieve emulator cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase/firestore/test/package-lock.json') }}

      # The lockfile pins every package, and none of them needs its install script to run the rules
      # tests, so a compromised dependency cannot run code while installing.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts

      # The installed compiler, never a package downloaded on demand.
      - name: Type-check
        run: |
          ./node_modules/.bin/tsc --noEmit

      # Starts the Firestore emulator from firebase.json, runs the suite against
      # firestore.rules, and fails the job if any test fails.
      - name: Run rules tests
        run: |
          npm test

  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          # The last version listed becomes JAVA_HOME. Robolectric needs 21 for SDK 36.
          java-version: |
            17
            21

      - name: Retrieve gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Decode secrets
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -z "$GOOGLE_SERVICES" ]; then
            echo "::error::GOOGLE_SERVICES secret is not set. Add app/google-services.json, base64-encoded, as a repository secret."
            exit 1
          fi
          echo "$GOOGLE_SERVICES" | base64 --decode > ./app/google-services.json

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      - name: Run unit tests
        run: |
          ./gradlew testDebugUnitTest --parallel --build-cache

      - name: Check coverage gate
        run: |
          ./gradlew coverageVerification

      # The tests of the script below; Node is preinstalled on the runner.
      - name: Test the new-code coverage script
        run: |
          node --test scripts/diff-coverage.test.mjs

      # Sends the code and the JaCoCo coverage to SonarCloud. Skipped without the token, which pull
      # requests from forks never get.
      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN is not available: skipping the SonarCloud analysis."
            exit 0
          fi
          ./gradlew jacocoTestReport sonar

      # GitHub-hosted runners need KVM enabled to run the x86_64 emulator at usable speed.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator needs about 7.4 GB for its data partition and a hosted runner has less free.
      # The NDK and the .NET and Haskell toolchains are not used by this build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Run instrumentation tests
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          avd-name: github
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 1080x2400
          disable-animations: true
          script: ./gradlew connectedCheck --parallel --build-cache

      # SonarCloud's gate on new code cannot be customised on the free plan, so this fails a pull
      # request whose added or changed lines have less than 90% of their branches covered. It runs
      # last so a pull request under the threshold still gets its SonarCloud report and its
      # instrumentation tests.
      - name: Check new-code branch coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          ./gradlew jacocoTestReport
          node scripts/diff-coverage.mjs --base "origin/$BASE_REF"
